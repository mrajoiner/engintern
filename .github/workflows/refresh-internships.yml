name: Refresh public engineering internships
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internship-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read all discoverable public browse pages
        run: node internships.mjs
      - name: Publish catalog snapshot
        run: |
          git config user.name 'EngIntern catalog updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-internships.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Internships.com engineering listings'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Refresh published website catalog
        run: curl --fail --retry 3 --max-time 180 -X POST https://engineering-launchpad-aj.blooksy.chatgpt.site/api/refresh
